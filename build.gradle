plugins {
    id 'java'
}

group = 'com.guba'
version = '1.1'

// Phase 3.3: THE SEVERING
// Ant has been fully decommissioned. Gradle now owns the build lifecycle.
// We have upgraded to Java 8 and migrated to Maven Central dependencies.

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['java']
            // Exclude test classes from main source set
            exclude 'com/guba/mogilefs/test/**'
        }
    }
    test {
        java {
            srcDirs = ['java/com/guba/mogilefs/test']
        }
    }
}

dependencies {
    // Native Gradle dependencies from Maven Central (replacing lib/ jars)
    implementation 'commons-pool:commons-pool:1.6'
    implementation 'log4j:log4j:1.2.17'
}

// Alias 'compile' to 'compileJava' for backwards compatibility with Ant scripts
tasks.register('compile') {
    dependsOn 'compileJava'
}

jar {
    archiveFileName = "mogilefs-${version}.jar"
    from sourceSets.main.output
}

// Phase 3.2: Add a generic JavaExec runner for legacy main classes
// Usage: ./gradlew runLegacyTest -PmainClass=com.guba.mogilefs.test.TestMogileFS
tasks.register('runLegacyTest', JavaExec) { t ->
    // Require -PmainClass to specify which class to execute
    def mc = project.findProperty('mainClass')
    if (!mc) {
        throw new GradleException("Missing -PmainClass. Example: -PmainClass=com.guba.mogilefs.test.TestMogileFS")
    }

    // Gradle 7.6 syntax for main class
    mainClass.set(mc.toString())

    // Classpath includes:
    // 1) Gradle-compiled classes from main and test sourceSets
    // 2) Runtime dependencies (commons-pool, log4j from Maven Central)
    classpath = sourceSets.main.runtimeClasspath + sourceSets.test.output

    // Ensure classes exist by compiling as needed
    dependsOn 'compileJava', 'compileTestJava'

    // Allow passing program args via -Pargs="..." (optional convenience)
    def argLine = (project.findProperty('args') ?: '').toString().trim()
    if (argLine) {
        args argLine.split('\\s+')
    }
}
