plugins {
    id 'java'
}

group = 'com.guba'
version = '1.1'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'commons-pool:commons-pool:1.6'
    implementation 'log4j:log4j:1.2.17'
    
    // JUnit 5 for integration tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.junit.platform:junit-platform-engine:1.10.0'
    testImplementation 'org.junit.platform:junit-platform-runner:1.10.0'
    testImplementation 'org.junit.platform:junit-platform-console-standalone:1.10.0'
}

tasks.register('compile') {
    dependsOn 'compileJava'
}

test {
    useJUnitPlatform()
    outputs.upToDateWhen { false }
}

jar {
    archiveFileName = "mogilefs-${version}.jar"
    from sourceSets.main.output
}

// Task to run StoreALot load test tool
tasks.register('runStoreALot', JavaExec) {
    group = 'verification'
    description = 'Run concurrent load test to verify thread-safe connection pooling'
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
    mainClass = 'com.guba.mogilefs.test.StoreALot'
    
    // Default arguments can be overridden from command line
    // Usage: ./gradlew runStoreALot --args="100 10"
    // First arg: iterations per thread (default 100)
    // Second arg: thread count (default 10)
    if (project.hasProperty('args')) {
        args = project.property('args').toString().split(',').collect { it.trim() }
    } else {
        args = ['100', '10']
    }
}