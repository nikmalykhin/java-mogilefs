services:
  # MogileFS Infrastructure (Tracker + Storage + MySQL)
  # All-in-one container with port mappings for macOS Docker Desktop
  mogilefs-infra:
    image: hrchu/mogilefs-all-in-one:latest
    platform: linux/amd64
    container_name: mogilefs-infra
    ports:
      - "7001:7001"  # Tracker port
      - "7500:7500"  # Storage port (dev1)
      - "7501:7501"  # Storage port (dev2)
      - "3306:3306"  # MySQL port
    environment:
      MOGILE_ADMIN_PASSWORD: admin
      MOGILE_TRACKER_PORT: 7001
      MOGILE_STORAGE_PORT: 7500
    volumes:
      - mogilefs-data:/var/lib/mogdata
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7001" ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  mogilefs-data:
