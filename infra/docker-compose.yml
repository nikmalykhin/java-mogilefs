services:
  # MogileFS Infrastructure (Tracker + Storage + MySQL)
  # All-in-one container with port mappings for macOS Docker Desktop
  mogilefs-infra:
    image: hrchu/mogilefs-all-in-one:latest
    platform: linux/amd64
    container_name: mogilefs-infra
    ports:
      - "7001:7001"  # Tracker port
      - "7500:7500"  # Storage port (dev1)
      - "7501:7501"  # Storage port (dev2)
      - "3306:3306"  # MySQL port
    environment:
      MOGILE_ADMIN_PASSWORD: admin
      MOGILE_TRACKER_PORT: 7001
      MOGILE_STORAGE_PORT: 7500
    volumes:
      - mogilefs-data:/var/lib/mogdata
    command: >
      bash -c "
      /run.sh &
      echo 'Waiting for tracker to be ready...';
      for i in {1..30}; do
        if nc -z localhost 7001 2>/dev/null; then
          echo 'Tracker is ready, initializing domain...';
          mogadm --trackers=localhost:7001 domain add www.guba.com 2>/dev/null || true;
          mogadm --trackers=localhost:7001 class add www.guba.com oneDeviceTest 2>/dev/null || true;
          mogadm --trackers=localhost:7001 class modify www.guba.com oneDeviceTest --mindevcount=1 2>/dev/null || true;
          echo 'Domain initialization complete';
          break;
        fi;
        sleep 2;
      done;
      wait
      "
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7001" ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

volumes:
  mogilefs-data:
