services:
  # Service 1: MogileFS Infrastructure (Tracker + Storage + MySQL)
  mogilefs-infra:
    image: hrchu/mogilefs-all-in-one:latest
    platform: linux/amd64
    container_name: mogilefs-infra
    networks:
      mogilefs-net:
        aliases:
          - qbert.guba.com
    ports:
      - "7001:7001" # Tracker port
      - "7500:7500" # Storage device port
      - "7501:7501" # Storage device port
      - "3306:3306" # MySQL port (for inspection)
    environment:
      MOGILE_ADMIN_PASSWORD: admin
      MOGILE_TRACKER_PORT: 7001
      MOGILE_STORAGE_PORT: 7500
    volumes:
      - mogilefs-data:/var/lib/mogdata
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7001" ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Service 2: Gradle 7.6 Bridge (Phase 3 - Modern build for legacy code)
  gradle-bridge:
    build:
      context: ..
      dockerfile: infra/Dockerfile.gradle
    container_name: gradle-mogilefs-bridge
    networks:
      - mogilefs-net
    depends_on:
      mogilefs-infra:
        condition: service_healthy
    volumes:
      - ..:/app
      # Map the source file to Eric's hardcoded path inside the container
      - ../java/com/guba/mogilefs/PooledMogileFSImpl.java:/Users/ericlambrecht/Projects/mogilefs/java/com/guba/mogilefs/PooledMogileFSImpl.java:ro
    working_dir: /app
    entrypoint: /docker-entrypoint.sh
    command: tail -f /dev/null
  # Service 3: Legacy Builder (Phase 2 - Java 6 + Ant, kept for reference)
  # Uncomment to use the original Ant-based build system
  # builder:
  #   build:
  #     context: ..
  #     dockerfile: infra/Dockerfile
  #   container_name: java6-mogilefs-builder
  #   networks:
  #     - mogilefs-net
  #   depends_on:
  #     mogilefs-infra:
  #       condition: service_healthy
  #   volumes:
  #     - ..:/app
  #     - ../java/com/guba/mogilefs/PooledMogileFSImpl.java:/Users/ericlambrecht/Projects/mogilefs/java/com/guba/mogilefs/PooledMogileFSImpl.java:ro
  #   working_dir: /app
  #   entrypoint: /docker-entrypoint.sh
networks:
  mogilefs-net:
    driver: bridge

volumes:
  mogilefs-data:
